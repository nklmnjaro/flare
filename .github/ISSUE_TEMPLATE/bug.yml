name: Bug
description: Reproducible product or engineering defect
title: "fix: "
labels: ["type/bug", "status/triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is broken?
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence / reproduction
      description: Commands, logs, contract IDs, screenshots. No secrets.
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: Impact / risk
  - type: textarea
    id: regression
    attributes:
      label: Regression protection
      description: What test/gate should prevent recurrence?
