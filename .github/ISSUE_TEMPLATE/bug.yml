# flare-bootstrap-managed: v1
name: Bug
description: Reproducible product or engineering defect
title: "fix: "
labels: ["type/bug", "status/triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is broken?
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence / reproduction
      description: Commands, outputs, contract IDs. Never paste secrets.
    validations:
      required: true
  - type: textarea
    id: protection
    attributes:
      label: Regression protection
      description: What test or gate should prevent recurrence?
