# flare-bootstrap-managed: v1
name: Product change
description: Problem-first feature proposal
title: "feat: "
labels: ["type/feature", "status/triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Start with the problem, not the implementation.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
  - type: textarea
    id: metric
    attributes:
      label: Success metric
  - type: textarea
    id: risks
    attributes:
      label: Failure / security / operational risks
