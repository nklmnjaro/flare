name: Repo policy

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  repo-policy:
    runs-on: ubuntu-latest
    env:
      PR_TITLE: ${{ github.event.pull_request.title || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check repository policy
        run: make check-fast
