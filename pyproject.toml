[project]
name = "flare-engineering-tools"
version = "0.0.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "jsonschema==4.26.0",
  "pydantic==2.13.4",
  "typer==0.27.1",
]

[dependency-groups]
dev = [
  "allure-pytest==2.16.0",
  "gitlint==0.19.1",
  "mypy==2.3.0",
  "pre-commit==4.6.0",
  "pytest==9.1.1",
  "pytest-xdist==3.8.0",
  "ruff==0.16.1",
  "types-jsonschema==4.26.0.20260518",
]

[tool.uv]
package = false
required-version = "==0.12.3"

[tool.ruff]
exclude = [
  ".cache/**",
  ".flare/**",
  ".tmp/**",
  ".venv/**",
  "**/.mypy_cache/**",
  "**/.pytest_cache/**",
  "**/.ruff_cache/**",
  "**/__pycache__/**",
  "**/*.pyc",
]
target-version = "py314"

[tool.ruff.lint]
extend-select = ["E501", "UP"]

[tool.flare.quality]
max-callable-lines = 80

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tools/quality/tests"]

[tool.mypy]
explicit_package_bases = true
mypy_path = "typings"
python_version = "3.14"
strict = true
